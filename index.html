<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENCLAVE — Strategic Prototyping</title>
  <meta name="description" content="ENCLAVE prototypes experiences, products, value propositions, brands and business models to help clients learn." />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ENCLAVE" />
  <meta property="og:description" content="Strategic prototyping: we prototype experiences, products, value propositions, brands and business models to help our clients learn." />
  <meta property="og:url" content="https://enclave.jp/" />
  <meta property="og:image" content="https://enclave.jp/assets/enclavelogo-black.png" />
  <meta property="og:locale" content="en" />
  <meta property="og:locale:alternate" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="canonical" href="https://enclave.jp/" />
  <link rel="alternate" hreflang="en" href="https://enclave.jp/" />
  <link rel="alternate" hreflang="ja" href="https://enclave.jp/ja/" />
  <link rel="alternate" hreflang="x-default" href="https://enclave.jp/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Type: Fraunces (editorial display serif) + Spline Sans Mono (technical accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..460;1,9..144,340..460&family=Space+Grotesk:wght@500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/site.css" />
  <!-- Decided before first paint, so the still logo never flashes up before
       the laser starts drawing it. ember.js takes the class off if WebGL fails. -->
  <script>
    if ("WebGLRenderingContext" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.documentElement.classList.add("has-ember");
  </script>
</head>
<body>
  <header class="top">
    <nav class="lang" aria-label="Language">
      <span class="current" aria-current="true">EN</span>
      <span class="sep" aria-hidden="true">/</span>
      <a href="ja/" hreflang="ja" lang="ja">日本語</a>
    </nav>
  </header>

  <div class="hero" aria-hidden="true"><canvas id="ember"></canvas></div>

  <main>
    <h1 class="mark"><img src="assets/enclavelogo-transparent-noborder.png" alt="ENCLAVE" width="1416" height="147" /></h1>
    <p class="tagline">Strategic Prototyping</p>

    <p class="lead">We prototype <span class="flap" aria-label="experiences, products, value propositions, brands, and business models" data-words="experiences|products|value propositions|brands|business models">experiences</span> to help our clients learn.</p>

    <div class="contact">
      <span class="label">Contact</span>
      <a href="mailto:hello@enclave.jp">hello@enclave.jp</a>
    </div>
  </main>

  <script src="assets/flap.js"></script>
  <script src="assets/ember.js"></script>
</body>
</html>
